cat <<EOF > index.html
<!DOCTYPE html>
<html>
<head>
    <title>Contact Us | Rishabhmeta</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        .brand { color: #007bff; font-size: 30px; font-weight: bold; margin-bottom: 10px; }
        h2 { color: #333; margin-bottom: 20px; }
        .group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        textarea { height: 100px; resize: none; }
        button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">Rishabhmeta</div>
        <h2>Contact Us</h2>
        <div class="group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter name">
        </div>
        <div class="group">
            <label>Email</label>
            <input type="email" id="email" placeholder="email@example.com">
        </div>
        <div class="group">
            <label>Message</label>
            <textarea id="message" placeholder="Aapka message..."></textarea>
        </div>
        <button onclick="sendData()">Send Message</button>
        <p id="status"></p>
    </div>

    <script>
        async function sendData() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;
            const status = document.getElementById('status');

            if(!name || !email) { alert("Details dalo bhai!"); return; }

            status.innerText = "Processing...";
            status.style.color = "#007bff";

            try {
                const res = await fetch('/api/contact', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, email, message })
                });
                const data = await res.json();
                status.innerText = data.msg;
                status.style.color = "green";
                // Clear Form
                document.getElementById('name').value = '';
                document.getElementById('email').value = '';
                document.getElementById('message').value = '';
            } catch (err) {
                status.innerText = "Error: Backend unreachable!";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
EOF
