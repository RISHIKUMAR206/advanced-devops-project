cat <<EOF > docker-compose.yml
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: rishi_admin
      POSTGRES_PASSWORD: rishi_pass
      POSTGRES_DB: devops_db
    volumes:
      - rishi_data:/var/lib/postgresql/data
    networks:
      - rishi_net

  app:
    build: .
    environment:
      DB_USER: rishi_admin
      DB_PASSWORD: rishi_pass
      DB_NAME: devops_db
    depends_on:
      - db
    networks:
      - rishi_net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - rishi_net

networks:
  rishi_net:
    driver: bridge

volumes:
  rishi_data:
EOF
