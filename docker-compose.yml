cat <<EOF > docker-compose.yml
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: rishi_admin
      POSTGRES_PASSWORD: rishi_pass
      POSTGRES_DB: devops_db
    networks:
      - rishi_net

  app:
    build: .
    depends_on:
      - db
    networks:
      - rishi_net

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rishi_net
    depends_on:
      - app

networks:
  rishi_net:
    driver: bridge
EOF
